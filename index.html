    const spots = [];
    for (let s = 0; s < 4; s++) spots.push(`radial-gradient(circle at ${Math.floor(R()*80+10)}% ${Math.floor(R()*70+10)}%, rgba(60,35,15,.${Math.floor(R()*3)+4}) 0 ${Math.floor(R()*5)+4}%, transparent ${Math.floor(R()*5)+10}%)`);

  const si = SI(c.stage), T = c.trans, full = c.sortingRequired === false, fpg = c.costBearer === 'FPG';
  const ev = (name, status, date, desc, sys, actor) => ({ name, status, date, desc, sys, actor });
  const L = [];
  L.push(ev('QC Failed','done',c.inspection.date,`AQL failure – ${c.inspection.defectPct}% defects (${c.inspection.reasons.join(', ')}). Lot blocked in Sloc2; GR ${c.gr} posted.`,'QC App',c.inspection.inspector));
  L.push(ev('Claim Created','done',c.created,`Claim auto-created from inspection ${c.inspId} with ${c.inspection.photos.length} photos and PO ${c.po}.`,'Claims App','System'));
  const notApp = (n, why) => L.push(ev(n,'skip',null,why,'—','—'));
  if (si === 0) { ['Supplier Review','Quotation Received','Sorting Completed','Re-QC Completed'].forEach(n => L.push(ev(n,'pending',null,'Awaiting sorting decision by Category Manager.','',''))); }
  else if (full) { ['Supplier Review','Quotation Received','Sorting Completed','Re-QC Completed'].forEach(n => notApp(n,'Not applicable – full failed case (no sorting).')); }
  else {
    if (fpg) notApp('Supplier Review','FairPrice bears sorting cost – supplier approval not required.');
    else L.push(ev('Supplier Review', si >= 2 ? 'done' : 'cur', si >= 2 ? c.supplierApproval.responded : c.supplierApproval.notified,
      si >= 2 ? `Supplier approved ${c.costBearer === 'SPLIT' ? c.supplierShare + '% share of' : ''} sorting cost via ISP.` : `Cost approval request sent to ISP · status: ${c.supplierApproval.status}.`, 'ISP Portal', c.supplier.contact));
    L.push(ev('Quotation Received', si >= 3 ? 'done' : si === 2 ? 'cur' : 'pending', si >= 2 ? c.quotes[2].received : null,
      si >= 3 ? `3 quotes received; awarded to ${agencyName(c.awarded.agency)} @ S$${c.awarded.rate.toFixed(2)}/kg.` : si === 2 ? '3/3 quotes received from Agency A, Agency B and CPU – award pending.' : 'Quotation request will auto-send to 2 agencies + CPU.', 'ISP Portal', si >= 3 ? c.owner : ''));
    L.push(ev('Sorting Completed', si >= 4 ? 'done' : si === 3 ? 'cur' : 'pending', si >= 4 ? c.sorting.end : null,
      si >= 4 ? `${fmtN(c.sorting.sortedQty)} kg sorted · ${fmtN(c.sorting.passedQty)} kg passed · ${fmtN(c.sorting.defectiveQty)} kg defective.` : si === 3 ? `Sorting in progress – ${c.sorting.progress}% complete.` : '', 'ISP Portal', si >= 3 ? agencyName(c.awarded.agency) : ''));
    L.push(ev('Re-QC Completed', si >= 5 ? 'done' : si === 4 ? 'cur' : 'pending', si >= 4 ? c.reqc.date : null,
      si >= 5 ? `Re-QC ${c.reqc.inspId} confirmed. Stock transfer ${c.stockTransfer.doc} (311) Sloc2 → Sloc1 for ${fmtN(c.stockTransfer.qty)} kg.` : si === 4 ? 'Re-QC results received – review & confirm.' : '', 'QC App · SAP', si >= 4 ? c.reqc.inspector : ''));
  }
  L.push(ev('Credit Note Received', si >= 6 ? 'done' : si === 5 ? 'cur' : 'pending', si >= 6 ? c.cn.received : (si === 5 ? c.cn.requested : null),
    si >= 6 ? `${c.cn.number} uploaded via ISP – ${fmtMoney(c.cn.amount, 2)}.` : si === 5 ? `CN requested for ${fmtN(c.finalFailedQty)} kg + supplier sorting share – ${fmtMoney(c.expectedCN, 2)}.` : '', 'ISP Portal', si >= 6 ? c.supplier.contact : 'System'));
  const stl = SETTLEMENTS.filter(s => s.claimId === c.id).slice(-1)[0];
  L.push(ev('SAP Settlement', si >= 8 ? 'done' : (si === 6 || si === 7) ? 'cur' : 'pending', stl ? stl.postingDate : null,
    si >= 8 ? `Credit memo ${stl.creditMemo} posted; settlement ${stl.settlementRef}.` : si === 7 ? `SAP posting status: ${stl.status}.` : si === 6 ? 'CN under AI validation before posting.' : '', 'SAP S/4HANA', 'MuleSoft'));
  L.push(ev('Write-Off', si >= 9 ? 'done' : si === 8 ? 'cur' : 'pending', si >= 9 ? c.writeOff.posted : null,
    si >= 9 ? `Write-off ${c.writeOff.sapDoc} (551) for ${fmtN(c.writeOff.qty)} kg · ${fmtMoney(c.writeOff.amount, 2)}.` : si === 8 ? `Approval in progress – ${c.writeOff.chain.join(' → ')}.` : '', 'SAP S/4HANA', si >= 9 ? c.writeOff.chain.slice(-1)[0] : ''));
  L.push(ev('Closed', si >= 10 ? 'done' : si === 9 ? 'cur' : 'pending', c.closed || null, si >= 10 ? 'CN, settlement and write-off reconciled. Claim closed.' : si === 9 ? 'Reconciliation check in progress.' : '', 'Claims App', si >= 10 ? 'System' : ''));
  return L;
}
function buildAudit(c){
  const out = [];
  buildTimeline(c).filter(e => e.status === 'done').forEach(e => out.push({ at: e.date, who: e.actor || 'System', action: e.name, detail: e.desc, sys: e.sys }));
  if (c.sortingRequired !== null && c.sortingRequired !== undefined) out.push({ at: addH(c.trans[1] || c.created, -1), who: c.owner, action: 'Sorting decision recorded', detail: c.sortingRequired ? `Sorting required · cost bearer: ${bearerLabel(c)}` : 'Full write-off (sorting not required)', sys: 'Claims App' });
  if (c.writeOff) c.writeOff.approvals.filter(a => a.status === 'Approved').forEach(a => out.push({ at: a.date, who: a.name, action: `Write-off approved (${a.role})`, detail: a.comment, sys: 'Claims App' }));
  return out.concat(c.audit).sort((a, b) => new Date(b.at) - new Date(a.at));
}

(function(){

    const c = CLAIMS[Math.floor(R2() * CLAIMS.length)]; const m = MSG_TYPES[Math.floor(R2() * MSG_TYPES.length)];
    let status = 'Delivered'; const roll = R2();
    if (roll > 0.93) status = 'Dead Letter'; else if (roll > 0.86) status = 'Failed'; else if (roll > 0.8) status = 'Retrying';
    MESSAGES.push({ id: `MSG-${String(880120 + i * 17)}`, type: m.t, sys: m.sys, dir: m.dir, api: m.api, claimId: c.id,
      at: new Date(TODAY.getTime() - Math.floor(R2() * 60 * 26) * 60e3), status, retries: status === 'Delivered' ? (R2() > 0.85 ? 1 : 0) : Math.floor(R2() * 3) + 1,
      ms: Math.floor(120 + R2() * 1800), corr: `corr-${Math.floor(R2() * 1e10).toString(16)}`,

  }
  // Ensure SAP failures reflect settlement records
  SETTLEMENTS.filter(s => s.status === 'Failed' || s.status === 'Retry Required').forEach((s, k) => MESSAGES.push({ id: `MSG-${String(889900 + k)}`, type: 'SAP.CreditMemo', sys: 'SAP S/4HANA', dir: 'Claims → SAP', api: 'API_SUPPLIERINVOICE_PROCESS_SRV', claimId: s.claimId, at: s.postingDate, status: s.status === 'Failed' ? 'Dead Letter' : 'Retrying', retries: s.status === 'Failed' ? 5 : 2, ms: 1840, corr: s.corr, error: s.message }));

function wlValue(c, k){ return ({ supplier: c.supplier.name, product: c.product.name, sla: ['Breached', 'At Risk', 'On Track', 'Closed'].indexOf(slaOf(c)), stage: SI(c.stage), created: -ageDays(c) })[k] ?? c[k]; }
function wlRows(){
  const w = state.wl, f = w.filters, q = w.q.toLowerCase();
  let rows = CLAIMS.filter(c => {
    if (w.quick === 'open' && c.stage === 'CLOSED') return false;
    if (w.quick === 'mine' && c.owner !== state.user.name && !(state.role === 'cm' && c.owner === USERS.cm.name)) return false;
    if (w.quick === 'risk' && !['At Risk', 'Breached'].includes(slaOf(c))) return false;
    if (w.quick === 'high' && c.claimValue < 20000) return false;
    if (w.quick === 'closed' && c.stage !== 'CLOSED') return false;
    if (f.stage && c.stage !== f.stage) return false;
    if (f.supplier && c.supplier.id !== f.supplier) return false;
    if (f.sla && slaOf(c) !== f.sla) return false;
    if (f.owner && c.owner !== f.owner) return false;
    if (f.cat && c.product.cat !== f.cat) return false;
    if (f.min && c.claimValue < +f.min) return false;
    if (f.max && c.claimValue > +f.max) return false;
    if (q && ![c.id, c.supplier.name, c.product.name, c.shipment, c.po, c.owner].join(' ').toLowerCase().includes(q)) return false;
    return true;
  });
  rows.sort((a, b) => { const x = wlValue(a, w.sort), y = wlValue(b, w.sort); return (x > y ? 1 : x < y ? -1 : 0) * w.dir; });
  return rows;
}

function phaseStepper(c){

    return `<div class="step ${cls}"><div class="dot">${cls === 'done' ? '<i class="fa-solid fa-check"></i>' : cls === 'skip' ? '<i class="fa-solid fa-minus"></i>' : `<i class="fa-solid ${p[2]}"></i>`}</div><div class="st">${p[0]}</div></div>`;

function calcImpact(c){
  const d = SD[c.id]; const avgRate = (AGENCIES.reduce((a, x) => a + x.rate, 0) / 3) * (c.product.cat === 'Vegetables' ? 0.8 : 1);
  const value = c.claimValue;
  if (d.mode === 'full') return { full: true, value, sortCost: 0, supShare: 0, fpShare: 0, expDefect: c.failedQty, recoverable: 0, cn: value, writeoff: value, net: 0 };
  const sortCost = c.failedQty * avgRate; const sh = d.bearer === 'SUP' ? 100 : d.bearer === 'FPG' ? 0 : d.share;
  const passRate = 0.62; const passed = c.failedQty * passRate; const defect = c.failedQty - passed;
  const supShare = sortCost * sh / 100, fpShare = sortCost - supShare;
  return { full: false, value, sortCost, supShare, fpShare, sh, expPassed: passed, expDefect: defect, recoverable: passed * c.unitCost, cn: defect * c.unitCost + supShare, writeoff: defect * c.unitCost, net: fpShare };
}

function rankQuotes(c){
  const q = c.quotes.map(x => ({ ...x }));
  const minT = Math.min(...q.map(x => x.total)), maxT = Math.max(...q.map(x => x.total)), minL = Math.min(...q.map(x => x.lead)), maxL = Math.max(...q.map(x => x.lead));
  q.forEach(x => { x.score = Math.round((0.55 * (maxT === minT ? 1 : (maxT - x.total) / (maxT - minT)) + 0.25 * (maxL === minL ? 1 : (maxL - x.lead) / (maxL - minL)) + 0.20 * ((x.rating - 3.5) / 1.5)) * 100); const card = CONFIG.rateCards.find(r => r.agency === agencyName(x.agency) && r.product.includes(c.product.cat === 'Vegetables' ? 'veg' : 'fruit')); x.card = card ? card.rate : null; x.var = x.card ? (x.rate - x.card) / x.card * 100 : 0; });
  [...q].sort((a, b) => b.score - a.score).forEach((x, i) => x.rank = i + 1);
  return q;
}

function reconRow(c){

  const claimAmt = c.expectedCN, cnAmt = c.cn && c.cn.amount, setAmt = stl ? stl.amount : 0, woAmt = c.writeOff ? c.writeOff.amount : null;
  const variance = round2((cnAmt || 0) - claimAmt); const vPct = claimAmt ? Math.abs(variance) / claimAmt * 100 : 0;
  const exceptions = [];

  const sapFail = !stl && lastS && (lastS.status === 'Failed' || lastS.status === 'Retry Required');
  if (!stl) exceptions.push(sapFail ? 'SAP posting ' + lastS.status.toLowerCase() : 'Settlement pending');
  if (vPct > CONFIG.thresholds[4].value) exceptions.push(`CN variance ${vPct.toFixed(2)}%`);

  modal(`${m.type} · ${m.id}`, `<div class="grid grid-cols-2 gap-3 mb-3 text-[12.5px]">${infoField('Correlation ID', `<span class="mono text-[11.5px]">${m.corr}</span>`)}${infoField('Latency', m.ms + ' ms')}</div><pre class="mono text-[11.5px] bg-slate-900 text-emerald-300 rounded-lg p-4 overflow-x-auto">${esc(JSON.stringify({ messageId: m.id, eventType: m.type, correlationId: m.corr, idempotencyKey: m.claimId, timestamp: new Date(m.at).toISOString(), source: m.dir.split(' → ')[0], target: m.dir.split(' → ')[1], payload: { claimId: c.id, purchaseOrder: c.po, vendor: c.supplier.vendor, material: c.product.sku, quantityKg: c.failedQty, plant: '1010', storageLocation: 'SLOC2' } }, null, 2))}</pre>`, '', 'max-w-xl', 'fa-code');
}

/* =====================================================================
   SCREEN: ADMINISTRATION & CONFIGURATION (FR-20)
   ===================================================================== */
const ADM = {
  roleAccess: { label: 'Role Permissions', icon: 'fa-user-lock', cols: [] },
  approvalMatrix: { label: 'Approval Matrix', icon: 'fa-sitemap', cols: [['band', 'Band'], ['min', 'From (S$)', 'number'], ['max', 'To (S$)', 'number'], ['approvers', 'Approver chain'], ['sla', 'SLA'], ['active', 'Active', 'bool']] },
  thresholds: { label: 'Thresholds', icon: 'fa-gauge-high', cols: [['key', 'Threshold'], ['value', 'Value', 'number'], ['unit', 'Unit']] },
  supplierCategories: { label: 'Supplier Categories', icon: 'fa-tags', cols: [['cat', 'Category'], ['desc', 'Description'], ['slaDays', 'CN SLA (days)', 'number'], ['autoEscalate', 'Auto-escalate'], ['suppliers', '# Suppliers', 'number']] },
  agencies: { label: 'Sorting Agencies', icon: 'fa-people-carry-box', cols: [['name', 'Agency'], ['legal', 'Legal entity'], ['type', 'Type'], ['capacity', 'Capacity'], ['rating', 'Service rating', 'number'], ['active', 'Active', 'bool']] },
  notificationRules: { label: 'Notification Rules', icon: 'fa-bell', cols: [['event', 'Event'], ['to', 'Recipients'], ['channel', 'Channel'], ['timing', 'Timing / reminders'], ['on', 'Enabled', 'bool']] },
  escalationMatrix: { label: 'Escalation Matrix', icon: 'fa-arrow-up-right-dots', cols: [['trigger', 'Trigger'], ['level1', 'Level 1'], ['level2', 'Level 2'], ['level3', 'Level 3']] },
  rateCards: { label: 'Rate Cards', icon: 'fa-money-bill-wave', cols: [['agency', 'Agency'], ['product', 'Product group'], ['rate', 'Rate', 'number'], ['uom', 'UoM'], ['from', 'Effective from', 'date'], ['to', 'Effective to', 'date']] },
  claimCategories: { label: 'Claim Categories', icon: 'fa-folder-tree', cols: [['code', 'Code'], ['name', 'Name'], ['flow', 'Process steps'], ['glAccount', 'GL account'], ['active', 'Active', 'bool']] }
};
CONFIG.agencies = AGENCIES;
function admData(k){ return k === 'roleAccess' ? SCREENS : CONFIG[k]; }
ROUTES.admin = function(){
  const tab = state.admTab || 'roleAccess'; const def = ADM[tab]; const rows = admData(tab); const ed = can('config');
  $('#main').innerHTML = `<div>${pageHeader('Administration & Configuration', 'Business rules maintained without code (FR-20). Changes are versioned, audited and take effect for new workflow steps.', ['Operations', 'Administration'],
    `${ed ? badge('Edit mode', 'green', 'fa-pen') : badge('Read-only – Claims Administrator only', 'gray', 'fa-lock')}`)}
  <div class="px-5 lg:px-7 pb-8 grid grid-cols-1 lg:grid-cols-12 gap-5">
    <div class="lg:col-span-3"><div class="card py-2">${Object.entries(ADM).map(([k, d]) => `<div class="flex items-center gap-3 px-4 py-2.5 cursor-pointer text-[13px] font-semibold border-l-[3px] ${tab === k ? 'border-brand-600 bg-brand-50 text-brand-700' : 'border-transparent text-slate-600 hover:bg-slate-50'}" onclick="state.admTab='${k}';ROUTES.admin()"><i class="fa-solid ${d.icon} w-4 text-center"></i>${d.label}<span class="ml-auto text-[11px] text-slate-400 font-medium">${admData(k).length}</span></div>`).join('')}</div>
      <div class="card mt-5 p-4 text-[12px] text-slate-600 space-y-2"><div class="font-bold text-slate-800"><i class="fa-solid fa-code-branch mr-1.5 text-brand-600"></i>Version history</div><div>v14 · ${fmtDT(addH(TODAY, -50))} · ${USERS.admin.name}<br><span class="text-slate-400">Rate card Agency A FY26/27</span></div><div>v13 · ${fmtDT(addH(TODAY, -310))} · ${USERS.admin.name}<br><span class="text-slate-400">Band 2 upper limit 15k → 20k</span></div></div></div>
    <div class="lg:col-span-9 space-y-5" id="adm-body">
      ${tab === 'approvalMatrix' ? `<div class="card"><div class="card-h"><div class="card-t"><i class="fa-solid fa-code-merge"></i>Split-cost quote approval rule</div>${badge('Open question – to confirm in design', 'amber')}</div><div class="card-b grid md:grid-cols-2 gap-3">
        ${[['both', 'Both parties approve', 'CM and supplier both approve the selected quote for split-cost claims.'], ['higher', 'Higher-share party only', 'Only the party bearing the larger share approves.']].map(o => `<div class="opt ${CONFIG.splitRule === o[0] ? 'on' : ''} ${ed ? '' : 'pointer-events-none'}" onclick="CONFIG.splitRule='${o[0]}';ROUTES.admin();toast('Split approval rule updated','blue')"><div class="font-bold text-[13.5px]">${o[1]}</div><div class="text-[12px] text-slate-500 mt-0.5">${o[2]}</div></div>`).join('')}</div></div>` : ''}
      <div class="card overflow-hidden"><div class="card-h"><div class="card-t"><i class="fa-solid ${def.icon}"></i>${def.label}</div><div class="flex gap-2">${ed ? `<button class="btn btn-s btn-sm" onclick="admAdd('${tab}')"><i class="fa-solid fa-plus"></i>Add row</button><button class="btn btn-p btn-sm" onclick="admSave('${tab}')"><i class="fa-solid fa-floppy-disk"></i>Save changes</button>` : ''}</div></div>
        <div class="overflow-x-auto"><table class="tbl"><thead><tr>${def.cols.map(c => `<th>${c[1]}</th>`).join('')}${ed ? '<th></th>' : ''}</tr></thead><tbody>
        ${rows.map((r, i) => `<tr>${def.cols.map(([k, , t]) => `<td>${t === 'bool' ? `<div class="switch ${r[k] ? 'on' : ''} ${ed ? '' : 'pointer-events-none opacity-60'}" onclick="CONFIG['${tab}'][${i}]['${k}']=!CONFIG['${tab}'][${i}]['${k}'];this.classList.toggle('on')"></div>`
          : `<input class="inp !py-1.5 ${t === 'number' ? 'text-right !w-28' : ''}" type="${t || 'text'}" value="${esc(r[k])}" ${ed ? '' : 'disabled'} onchange="CONFIG['${tab}'][${i}]['${k}']=${t === 'number' ? '+this.value' : 'this.value'}">`}</td>`).join('')}
          ${ed ? `<td><button class="w-8 h-8 rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50" onclick="CONFIG['${tab}'].splice(${i},1);ROUTES.admin()"><i class="fa-regular fa-trash-can"></i></button></td>` : ''}</tr>`).join('')}
        </tbody></table></div>
        <div class="px-4 py-3 border-t border-slate-100 text-[11.5px] text-slate-500 flex items-center gap-2"><i class="fa-solid fa-circle-info"></i>${{ approvalMatrix: 'Write-off routing by value (FR-16). Approver chain is cumulative.', thresholds: 'AI confidence thresholds drive the green / amber / red indicators in the AI Extraction Workbench.', rateCards: 'Rate cards with effective dates are used to benchmark sorting quotes (FR-07).', agencies: 'Agency master is synchronised with ISP via API (NFR-ISP-06).', notificationRules: 'All notifications include a deep link to the task (FR-18, ≤ 3 clicks to decision).', escalationMatrix: 'Escalations trigger automatically from SLA timers.', supplierCategories: 'Supplier master synchronised from SAP / ISP; category drives SLAs.', claimCategories: 'Claim category determines the workflow variant and GL mapping.' }[tab]}</div></div>
    </div>
  </div></div>`;
};
const _admRoute = ROUTES.admin;
ROUTES.admin = function(){ _admRoute(); if ((state.admTab || 'roleAccess') === 'roleAccess') $('#adm-body').innerHTML = roleAccessHTML(can('config')); };
function roleAccessHTML(ed){
  const roles = Object.keys(USERS); let sec = '';
  return `<div class="card overflow-hidden"><div class="card-h"><div class="card-t"><i class="fa-solid fa-user-lock"></i>Role Permissions – screen access by persona</div>${ed ? `<button class="btn btn-p btn-sm" onclick="toast('Role permissions saved as version v15 – takes effect at next sign-in','green')"><i class="fa-solid fa-floppy-disk"></i>Save changes</button>` : ''}</div>
    <div class="overflow-x-auto"><table class="tbl"><thead><tr><th>Screen</th>${roles.map(r => `<th class="text-center"><div class="flex flex-col items-center gap-1"><span class="w-7 h-7 rounded-full ${USERS[r].color} text-white text-[10px] font-bold flex items-center justify-center">${USERS[r].initials}</span>${USERS[r].role}</div></th>`).join('')}</tr></thead><tbody>
    ${SCREENS.map(s => { const head = s[2] !== sec ? (sec = s[2], `<tr><td colspan="${roles.length + 1}" class="!bg-slate-50 lbl !py-2">${s[2]}</td></tr>`) : '';
      return head + `<tr><td class="font-semibold">${s[1]}</td>${roles.map(r => { const on = s[0] === 'dashboard' || ACCESS[r].includes(s[0]); const lock = s[0] === 'dashboard' || (LOCKED[r] || []).includes(s[0]);
        return `<td class="text-center"><div class="inline-flex"><div class="switch ${on ? 'on' : ''} ${ed && !lock ? '' : 'pointer-events-none opacity-60'}" title="${lock ? 'Always on' : ''}" onclick="toggleAccess('${r}','${s[0]}')"></div></div></td>`; }).join('')}</tr>`; }).join('')}
    </tbody></table></div>
    <div class="px-4 py-3 border-t border-slate-100 text-[11.5px] text-slate-500 flex items-center gap-2"><i class="fa-solid fa-circle-info"></i>Navigation, links, task inbox and notifications only show screens the role can access; direct URLs to other screens show “Access restricted”. Enforced server-side via IAP + API authorisation (NFR-SEC).</div></div>`;
}
function toggleAccess(r, p){ const a = ACCESS[r]; const i = a.indexOf(p); if (i >= 0) a.splice(i, 1); else a.push(p); renderNav(); ROUTES.admin(); toast(`${USERS[r].role}: ${pageLabel(p)} access ${i >= 0 ? 'removed' : 'granted'}`, 'blue'); }
function admAdd(tab){ const row = {}; ADM[tab].cols.forEach(([k, , t]) => row[k] = t === 'bool' ? true : t === 'number' ? 0 : ''); CONFIG[tab].push(row); ROUTES.admin(); }
function admSave(tab){ toast(`${ADM[tab].label} saved as version v15 – audit entry created`); }

/* =====================================================================
   INIT
   ===================================================================== */
initSearch();
showLogin();
</script>
</body></html>
